<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вхід — WakeUp</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-wrap { min-height:calc(100vh - 128px); display:flex; align-items:center; justify-content:center; padding:2rem 1rem; }
    .auth-card { width:100%; max-width:420px; }
    .auth-title { font-size:1.5rem; font-weight:700; letter-spacing:-.03em; margin-bottom:.4rem; }
    .auth-subtitle { color:var(--text2); font-size:.9rem; margin-bottom:2rem; }
    .brand-bar { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:2rem; }
    .brand-bar .logo-icon { width:44px; height:44px; font-size:22px; }
    .brand-name { font-size:1.5rem; font-weight:700; letter-spacing:-.03em; }
    .password-wrap { position:relative; }
    .password-wrap input { padding-right:44px; }
    .toggle-pw { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text3); font-size:18px; line-height:1; padding:0; }
    .toggle-pw:hover { color:var(--text2); }
    .remember-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; }
    .remember-label { display:flex; align-items:center; gap:8px; font-size:.9rem; color:var(--text2); cursor:pointer; }
    .demo-box { background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; font-size:.85rem; color:var(--text2); margin-bottom:1rem; }
    .demo-box span { color:var(--accent2); font-family:"Space Mono",monospace; font-size:.8rem; }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="index.html" class="logo"><div class="logo-icon">⏰</div>WakeUp</a>
    <nav>
      <a href="register.html">Реєстрація</a>
      <a href="login.html" class="active">Увійти</a>
      <a href="about.html">Про додаток</a>
    </nav>
    <button class="hamburger" id="hamburgerBtn"><span></span><span></span><span></span></button>
  </div>
</header>
<div class="mobile-nav" id="mobileNav">
  <a href="register.html">Реєстрація</a>
  <a href="login.html" class="active">Увійти</a>
  <a href="about.html">Про додаток</a>
</div>
<main style="padding:0;">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand-bar"><div class="logo-icon">⏰</div><span class="brand-name">WakeUp</span></div>
      <div class="card">
        <h1 class="auth-title">З поверненням!</h1>
        <p class="auth-subtitle">Увійдіть, щоб керувати своїми будильниками</p>
        <div id="loginError" class="alert alert-error" style="display:none;"></div>
        <form id="loginForm">
          <div class="form-group">
            <label for="email">Електронна пошта</label>
            <input type="email" id="email" placeholder="your@email.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="password">Пароль</label>
            <div class="password-wrap">
              <input type="password" id="password" placeholder="Ваш пароль" required autocomplete="current-password">
              <button type="button" class="toggle-pw" id="togglePassword">👁</button>
            </div>
          </div>
          <div class="remember-row">
            <label class="remember-label"><input type="checkbox" checked>Запам'ятати мене</label>
            <a href="#" class="link">Забули пароль?</a>
          </div>
          <button type="submit" class="btn btn-primary btn-full">Увійти →</button>
        </form>
        <hr class="divider">
        <p style="text-align:center;font-size:.9rem;color:var(--text2);">Немає акаунту? <a href="register.html" class="link">Зареєструватися</a></p>
      </div>
    </div>
  </div>
</main>
<footer>
  <div class="footer-inner">
    <span>© 2025 WakeUp</span>
  </div>
</footer>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
<script>
  const users = Storage.get('wakeup_users') || [];
  if (!users.find(u => u.email === 'demo@wakeup.app')) {
    users.push({ id:1, name:'Тарас Турчик', email:'demo@wakeup.app', gender:'male', dob:'2006-06-08', password:'demo123', createdAt:'20.04.2026' });
    Storage.set('wakeup_users', users);
  }
  document.getElementById('hamburgerBtn').addEventListener('click', () => {
    document.getElementById('mobileNav').classList.toggle('open');
  });
</script>
</body>
</html>
